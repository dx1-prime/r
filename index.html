<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>R | Home</title>
<link rel="icon" href="r.png">

<style>
:root{
  --bg:#37515d;
  --card:#76a7c9;
  --primary:#42718a;
  --text:#ffffff;
  --muted:#9aa3b2;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: 'Segoe UI', Tahoma, sans-serif;
}

body{
  background:var(--bg);
  color:var(--text);
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  text-align:center;
}

.container{
  max-width:600px;
  padding:40px;
}

.logo{
  font-size:80px;
  font-weight:700;
  background:linear-gradient(45deg,#9a6bff,#5b8cff);
  border-radius: 18px;
  margin-bottom:20px;
}

h1{
  font-size:28px;
  margin-bottom:10px;
}

p{
  color:var(--muted);
  margin-bottom:30px;
}

.btn{
  background:var(--primary);
  border:none;
  padding:14px 28px;
  border-radius:12px;
  color:#fff;
  font-size:16px;
  cursor:pointer;
  transition:.4s;
}

.btn:hover{
  transform:scale(1.05);
  opacity:.9;
}

footer{
  position:absolute;
  bottom:20px;
  font-size:14px;
  color:var(--muted);
}



</style>

</head>
<body>

<div class="container">
  <div class="logo">R</div>
  <h1>مرحبًا بك</h1>
  <p>إذا احتجت أي مساعدة، فريق الدعم موجود للرد عليك مباشرة عبر الشات.</p>
  <button class="btn">تواصل معنا الآن</button>
</div>

<footer>
  © 2025 R — جميع الحقوق محفوظة لدى
</footer>

</body>
</html>
